[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-consumer-reset-plan"
version = "0.1.0"
description = "Plan Kafka consumer group offset resets safely: preview new offsets and lag, print the exact kafka-consumer-groups commands, never run them."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
keywords = ["kafka", "consumer-groups", "offsets", "sre", "operations"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kafka-consumer-reset-plan = "kafka_consumer_reset_plan.cli:main"

[project.urls]
Homepage = "https://github.com/narayana006/kafka-consumer-reset-plan"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
