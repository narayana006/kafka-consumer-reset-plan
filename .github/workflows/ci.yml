name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Run the CLI on the examples
        run: |
          kafka-consumer-reset-plan examples/order-processor.describe.txt --to-earliest --earliest-file examples/earliest-offsets.txt
          kafka-consumer-reset-plan examples/shipment-tracker.describe.txt --to-datetime 2025-06-01T10:00:00.000Z --offsets-for-times-file examples/shipments.offsets-for-times.txt --format json
          kafka-consumer-reset-plan examples/billing-sync.describe.txt --shift-by -100 --topic orders:2
          # an active group must be reported as blocked (exit code 3)
          set +e
          kafka-consumer-reset-plan examples/payments-ledger.describe.txt --to-earliest
          test $? -eq 3
